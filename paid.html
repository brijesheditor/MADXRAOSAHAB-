<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sunny</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #1e1e2f, #3a0ca3);
        font-family: 'Poppins', sans-serif;
    }

    .text {
        font-size: 80px;
        font-weight: bold;
        color: #fff;
        letter-spacing: 5px;
        text-transform: uppercase;
        text-shadow: 
            0 0 10px #fff,
            0 0 20px #00f,
            0 0 40px #0ff,
            0 0 80px #0ff;
        animation: glow 2s infinite alternate;
    }

    @keyframes glow {
        from {
            text-shadow: 
                0 0 10px #fff,
                0 0 20px #00f,
                0 0 40px #0ff;
        }
        to {
            text-shadow: 
                0 0 20px #fff,
                0 0 40px #00f,
                0 0 80px #0ff;
        }
    }
</style>
</head>
<body>

<div class="text">Sunny</div>

</body>
</html>
